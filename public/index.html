<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Every Little Engine</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%2300539F'/><rect x='3' y='7' width='10' height='2' fill='white'/></svg>"
    />
    <link rel="stylesheet" href="/vendor/pico/pico.min.css" />
    <style>
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1.2rem;
      }
      .cards article {
        margin: 0;
        display: flex;
        flex-direction: column;
        border: 3px solid currentcolor;
        border-radius: 0;
        box-shadow: 6px 6px 0 rgb(0 0 0 / 35%);
      }
      .cards p {
        flex: 1;
      }
      .cards a[role="button"] {
        border-radius: 0;
        border: 2px solid currentcolor;
      }
      .swatch {
        display: inline-block;
        width: 0.8em;
        height: 0.8em;
        margin-right: 0.3em;
        vertical-align: baseline;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <hgroup style="margin-top: 2.5rem">
        <h1>Every Little Engine</h1>
      </hgroup>

      <div class="cards">
        <article>
          <h3>🟦 Aisle Runner</h3>
          <p>
            Thank you uni, a platformer i made for a moduel in fist year: Its got coyote time, jump buffering, moving platforms and the audio system i definetly didnt steal
          </p>
          <a href="/platformer/" role="button">Play the platformer</a>
        </article>ç
      </div>
      </p>
    </main>
  </body>
</html>
